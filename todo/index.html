<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TODO</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISV5WaRU90FeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEWIH"
    crossorigin="anonymous"
  />

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      color: green;
    }

    #age {
      height: 40px;
      font-size: 1.2rem;
    }

    .btn-success {
      height: 40px;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <div id="infield" class="mt-5 row w-100">
    <div class="col-md-4"></div>
    <div class="col-md-4">
      <div class="p-5 mt-5 border">
        <h1 class="text-center text-success">TODO</h1>
        <div class="gap-2 p-3 border shadow d-flex border-success">
          <input
            id="data"
            type="text"
            placeholder="add new TODO"
            class="form-control"
            aria-label="Username"
          />
          <button class="btn btn-success" onclick="add()">ADD</button>
        </div>
        <ul class="mt-3 text-center text-success" id="result"></ul>
      </div>
    </div>
    <div class="col-md-4"></div>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYfetY31HB60NNkmXc5s9fDVZLEsaAA55NDZOxhy9GkcIds1K1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>

  <script>
     function add(){
        if(data.value){
            result.innerHTML += `<li>${data.value}</li>`;
        }else {
            alert("Please enter the value")
        }
     }
  </script>
</body>
</html>
