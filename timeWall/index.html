<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clock</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISV5WaRU90FeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEWIH"
    crossorigin="anonymous"
  />

  <style>
     body {
      min-height: 100vh;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 0;
      background-color: black;
      display: flex;
    }
    
    h1 {
      color: green;
      font-size: 5rem;
      margin: 0;
    }
  </style>
</head>
<body>
  <h1 id="time">27:08:20 PM</h1>

  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYfetY31HB60NNkmXc5s9fDVZLEsaAA55NDZOxhy9GkcIds1K1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>

  <script>
   function getTime() {
    const time = new Date()
    console.log(time);

    const hours = time.getHours();
    console.log(hours);

    const minutes = time.getMinutes();
    console.log(minutes);

    const sec = time.getSeconds();
    console.log(sec);
    const result = document.getElementById('time');
    result.innerHTML = `${hours > 12 ? hours - 12: hours}:${minutes}:${sec} ${hours > 12 ? 'PM' : 'AM'}`;

    setTimeout(()=>{
        getTime();
       },1000)
   }

   getTime();
  
  </script>
</body>
</html>
