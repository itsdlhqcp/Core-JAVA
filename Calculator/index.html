<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Calculator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="p-4 shadow card" style="width: 320px;">
        <h4 class="mb-3 text-center">Calculator</h4>
        <input type="text" id="display" class="mb-3 form-control text-end" readonly>

        <div class="row g-2">
            <!-- Row 1 -->
            <div class="col-3"><button class="btn btn-secondary w-100" onclick="append('7')">7</button></div>
            <div class="col-3"><button class="btn btn-secondary w-100" onclick="append('8')">8</button></div>
            <div class="col-3"><button class="btn btn-secondary w-100" onclick="append('9')">9</button></div>
            <div class="col-3"><button class="btn btn-warning w-100" onclick="append('/')">/</button></div>

            <!-- Row 2 -->
            <div class="col-3"><button class="btn btn-secondary w-100" onclick="append('4')">4</button></div>
            <div class="col-3"><button class="btn btn-secondary w-100" onclick="append('5')">5</button></div>
            <div class="col-3"><button class="btn btn-secondary w-100" onclick="append('6')">6</button></div>
            <div class="col-3"><button class="btn btn-warning w-100" onclick="append('*')">*</button></div>

            <!-- Row 3 -->
            <div class="col-3"><button class="btn btn-secondary w-100" onclick="append('1')">1</button></div>
            <div class="col-3"><button class="btn btn-secondary w-100" onclick="append('2')">2</button></div>
            <div class="col-3"><button class="btn btn-secondary w-100" onclick="append('3')">3</button></div>
            <div class="col-3"><button class="btn btn-warning w-100" onclick="append('-')">-</button></div>

            <!-- Row 4 -->
            <div class="col-3"><button class="btn btn-secondary w-100" onclick="append('0')">0</button></div>
            <div class="col-3"><button class="btn btn-secondary w-100" onclick="append('.')">.</button></div>
            <div class="col-3"><button class="btn btn-success w-100" onclick="calculate()">=</button></div>
            <div class="col-3"><button class="btn btn-warning w-100" onclick="append('+')">+</button></div>

            <!-- Row 5 -->
            <div class="col-6"><button class="btn btn-danger w-100" onclick="clearDisplay()">C</button></div>
            <div class="col-6"><button class="btn btn-dark w-100" onclick="backspace()">⌫</button></div>
        </div>
    </div>

    <!-- Calculator Script -->
    <script>
        function append(value) {
            document.getElementById("display").value += value;
        }

        function clearDisplay() {
            document.getElementById("display").value = '';
        }

        function backspace() {
            let current = document.getElementById("display").value;
            document.getElementById("display").value = current.slice(0, -1);
        }

        function calculate() {
            try {
                document.getElementById("display").value = eval(document.getElementById("display").value);
            } catch (e) {
                alert("Invalid expression");
            }
        }
    </script>
</body>
</html>
