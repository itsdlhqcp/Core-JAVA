  <body class="p-4">
    <h1>Document object model</h1>
    <h1 id="dom" class="cls">DOM</h1>
    <p class="cls">
      Hello how are you doing here in the past of the days here !!
    </p>
    <button class="btn btn-primary" onclick="change()">Change DOM</button>

    <h1 id="eligible">Voting Eligibility</h1>
    <div class="row w-100">
        <div class="col-md-4"></div>
        <div class="col-md-4">
            <div class="p-5 mt-5 border">
                 <h1 class="text-center text-success">Voting Eligibility</h1>
                 <div class="mt-5 d-flex">
                    <input id="age" type="text" placeholder="Enter your age" class="form-control" aria-label="Username">
                    <button class="btn btn-success me-3" onclick="agechecker()">Check</button>
                    <h3 class="text-center text-success" id="result"></h3>
                 </div>
            </div> 
        </div>
    </div>

      function change() {
        const res = document.getElementById("dom");
        res.innerHTML = "Hello World";
        res.style.color = "red";
        res.style.fontSize = "20px";
      }

      function agechecker() {
        const age = document.getElementById("age")?.value;
        console.log(age);
        if(age){
            if (age <= 18) {
                alert("You are not eligible to vote");
              const eli = document.getElementById("result");
              eli.innerHTML = "You are not eligible to vote";
              eli.style.color = "red";
              eli.style.fontSize = "12px";
            } else {
                alert("You are eligible to vote");
              const noteli = document.getElementById("result");
              noteli.innerHTML = "You are eligible to vote";
              noteli.style.color = "green";
              noteli.style.fontSize = "12px";
            }
        }else if (isNaN(age) === true) {
            alert("Please enter a valid age");
            const noteli = document.getElementById("result");
            noteli.innerHTML = "Please enter a valid age";
            noteli.style.color = "orange";
            noteli.style.fontSize = "12px";
        }else {
            alert("Please enter a valid age");
            const noteli = document.getElementById("result");
            noteli.innerHTML = "Please enter value";
            noteli.style.color = "red";
            noteli.style.fontSize = "12px";
        }
      }
    </script>
